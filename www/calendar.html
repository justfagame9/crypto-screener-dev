<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151B;
    --panel2:#171B22;
    --border:#232833;
    --text:#E6E9EF;
    --muted:#8B93A3;
    --faint:#565F70;
    --accent:#35E0C0;
    --amber:#F5A623;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{padding:18px 12px 40px;background:var(--bg);background-image:radial-gradient(circle at 12% 0%,rgba(53,224,192,.06),transparent 40%),radial-gradient(circle at 92% 15%,rgba(255,84,112,.05),transparent 35%);color:var(--text);font-family:var(--font-display);}
  .wrap{max-width:640px;margin:0 auto;}
  .eyebrow{font:10px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  h1{font-size:20px;margin:0 0 4px;font-weight:700;}
  .status{color:var(--muted);font:11px var(--font-mono);margin:8px 0 14px;}
  .status a{color:var(--accent);text-decoration:none;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  thead th{background:var(--panel2);color:var(--muted);text-align:left;font:600 9px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;border:1px solid var(--border);}
  thead th.col-impact{width:34px;text-align:center;}
  thead th.col-date{width:64px;}
  tbody td{padding:8px 6px;border:1px solid var(--border);font-size:12.5px;color:var(--text);vertical-align:top;line-height:1.35;}
  .impact-cell{text-align:center;font-size:14px;}
  .date-group{white-space:nowrap;font-weight:700;color:var(--accent);font-size:11.5px;font-family:var(--font-mono);text-align:left;vertical-align:top;}
  .date-group.today{color:var(--amber);}
  .event-cell{word-break:break-word;}
  .muted{color:var(--muted);}
  .empty{padding:22px 14px;color:var(--faint);font:11.5px var(--font-mono);text-align:center;border:1px dashed var(--border);border-radius:10px;}
  .error{color:#ffb3c1;border-color:rgba(255,84,112,.35);}
  .note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:12px;}
  .note a{color:var(--accent);text-decoration:none;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font:10.5px var(--font-mono);margin:8px 2px 0;}
  .legend span{white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">MACRO · CALENDAR</div>
  <h1>Calendar</h1>
  <div class="status" id="status">Loading economic calendar...</div>
  <div class="panel">
    <div id="calendarRoot"><div class="empty">Fetching the latest macro events...</div></div>
  </div>
  <div class="legend">
    <span>🔴 High</span>
    <span>🟠 Medium</span>
    <span>🟢 Low</span>
  </div>
  <p class="note" id="footerNote"></p>
</div>
<script>
// CryptoCraft's JSON export only ever returns the CURRENT Sun-Sat week (no
// query params respected, no lastweek/nextweek files exist - confirmed).
// Next week's data is fetched separately through our own Worker, which
// scrapes the live calendar page for that week since there's no official
// JSON export for arbitrary weeks.
const SOURCE_URLS = [
  'https://nfs.faireconomy.media/cc_calendar_thisweek.json'
];
const SOURCE_LINK = 'https://www.cryptocraft.com/calendar';
const DAYS_FORWARD = 7; // today + next 7 days
const REFRESH_MS = 60 * 60 * 1000; // hourly
const FETCH_TIMEOUT_MS = 6000;

// Your deployed Cloudflare Worker (calendar-worker.js). Handles both the
// CORS-proxying of the JSON feed and the next-week HTML scrape.
const WORKER_PROXY_URL = 'https://calendar-proxy.justfagame9.workers.dev';

const root = document.getElementById('calendarRoot');
const status = document.getElementById('status');
const footerNote = document.getElementById('footerNote');
let refreshTimer = null;

footerNote.innerHTML = 'Times, Actual/Forecast/Previous values, and full event detail aren\'t shown here to keep this compact \u2014 check <a href="' + SOURCE_LINK + '" target="_blank" rel="noopener noreferrer">Crypto Craft</a> directly for exact release time and live data on any event.';

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function formatDate(date){
  return new Intl.DateTimeFormat('en-US', {month:'short', day:'numeric'}).format(date);
}
function localDayKey(date){
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
}
function impactSymbol(impact){
  const normalized = String(impact ?? '').toLowerCase();
  if(/high|important|red/.test(normalized)) return '🔴';
  if(/medium|med|yellow|ora/.test(normalized)) return '🟠';
  if(/low|green/.test(normalized)) return '🟢';
  return '⚪';
}
function impactRank(impact){
  const normalized = String(impact ?? '').toLowerCase();
  if(/high|important|red/.test(normalized)) return 0;
  if(/medium|med|yellow|ora/.test(normalized)) return 1;
  if(/low|green/.test(normalized)) return 2;
  return 3; // unrated/holiday-style entries sort last within the day
}
function isInDateRange(date){
  const now = new Date();
  const rangeStart = new Date(now);
  rangeStart.setHours(0,0,0,0);
  const rangeEnd = new Date(now.getTime() + DAYS_FORWARD * 86400000);
  rangeEnd.setHours(23,59,59,999);
  return date >= rangeStart && date <= rangeEnd;
}

const MONTH_ABBR = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function weekToken(sundayDate){
  return MONTH_ABBR[sundayDate.getMonth()] + sundayDate.getDate() + '.' + sundayDate.getFullYear();
}
function thisWeekSunday(){
  const today = new Date();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay());
  return sunday;
}
// CryptoCraft's own thisweek.json export can lag behind the actual current
// week (observed: still returning last week's data on the first day of a
// new week). Rather than trust the JSON feed to represent "this week"
// correctly, we scrape BOTH the current week's page and next week's page
// through the Worker every time, and merge everything with the JSON feed.
// Dedup below takes care of any overlap.
function thisWeekToken(){
  return weekToken(thisWeekSunday());
}
function nextWeekToken(){
  const nextSunday = new Date(thisWeekSunday());
  nextSunday.setDate(nextSunday.getDate() + 7);
  return weekToken(nextSunday);
}

function candidateUrls(url){
  const encoded = encodeURIComponent(url);
  const candidates = [];
  if(WORKER_PROXY_URL) candidates.push(WORKER_PROXY_URL.replace(/\/$/, '') + '?url=' + encoded);
  candidates.push(url);
  candidates.push('https://api.allorigins.win/raw?url=' + encoded);
  candidates.push('https://corsproxy.io/?url=' + encoded);
  return candidates;
}

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, {cache:'no-store', signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}

async function fetchOne(url){
  for(const candidate of candidateUrls(url)){
    try{
      const res = await fetchWithTimeout(candidate, FETCH_TIMEOUT_MS);
      if(!res.ok) continue;
      const data = await res.json();
      if(Array.isArray(data)) return data;
    }catch(error){
      // this candidate failed or timed out - try the next one
    }
  }
  return [];
}

async function fetchWeekViaWorker(token){
  if(!WORKER_PROXY_URL) return [];
  const url = WORKER_PROXY_URL.replace(/\/$/, '') + '?week=' + encodeURIComponent(token);
  try{
    const res = await fetchWithTimeout(url, FETCH_TIMEOUT_MS * 2);
    if(!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }catch(error){
    return [];
  }
}

async function fetchAllWeeks(){
  const [jsonFeedResults, thisWeekScraped, nextWeekScraped] = await Promise.all([
    Promise.all(SOURCE_URLS.map(fetchOne)),
    fetchWeekViaWorker(thisWeekToken()),
    fetchWeekViaWorker(nextWeekToken())
  ]);
  const merged = jsonFeedResults.flat().concat(thisWeekScraped).concat(nextWeekScraped);
  const seen = new Set();
  const deduped = [];
  merged.forEach(item => {
    if(!item || !item.date || !item.title) return;
    const key = item.title + '__' + item.date + '__' + (item.country || '');
    if(seen.has(key)) return;
    seen.add(key);
    deduped.push(item);
  });
  return deduped;
}

function normalizeCalendarRows(items){
  const rows = [];
  items.forEach(item => {
    const dateObj = new Date(item.date);
    if(Number.isNaN(dateObj.getTime())) return;
    if(!isInDateRange(dateObj)) return;
    rows.push({
      dateObj,
      dayKey: localDayKey(dateObj),
      impact: item.impact || '',
      impactRank: impactRank(item.impact),
      event: item.country && item.country !== 'All' ? item.country + ' ' + item.title : (item.title || '')
    });
  });
  return rows;
}

function renderRows(rows){
  const todayKey = localDayKey(new Date());

  // Group by day, High -> Medium -> Low (unrated last) within each day.
  const dayCounts = {};
  rows.forEach(r => { dayCounts[r.dayKey] = (dayCounts[r.dayKey] || 0) + 1; });

  let lastDayKey = '';
  let html = '';

  rows.forEach(row => {
    const isNewDay = row.dayKey !== lastDayKey;
    lastDayKey = row.dayKey;
    const impactCell = `<td class="impact-cell">${impactSymbol(row.impact)}</td>`;
    const eventCell = `<td class="event-cell">${escapeHtml(row.event)}</td>`;

    let dateCell = '';
    if(isNewDay){
      const isToday = row.dayKey === todayKey;
      const dateLabel = isToday ? 'Today' : formatDate(row.dateObj);
      dateCell = `<td class="date-group${isToday ? ' today' : ''}" rowspan="${dayCounts[row.dayKey]}">${escapeHtml(dateLabel)}</td>`;
    }

    html += `<tr>${impactCell}${dateCell}${eventCell}</tr>`;
  });

  return html;
}

function scheduleRefresh(){
  if(refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(loadCalendar, REFRESH_MS);
}

async function loadCalendar(){
  status.textContent = 'Fetching the latest events...';
  try{
    const raw = await fetchAllWeeks();
    if(!raw.length) throw new Error('No data returned from source');

    const rows = normalizeCalendarRows(raw).sort((a, b) => {
      if(a.dayKey !== b.dayKey) return a.dayKey < b.dayKey ? -1 : 1;
      return a.impactRank - b.impactRank;
    });
    if(!rows.length) throw new Error('No events in the selected date range');

    const tableRows = renderRows(rows);
    root.innerHTML = `
      <table>
        <thead>
          <tr><th class="col-impact">!</th><th class="col-date">Date</th><th>Event</th></tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    `;

    const stamp = new Intl.DateTimeFormat('en-US', {hour:'2-digit', minute:'2-digit', hour12:true}).format(new Date());
    status.innerHTML = `${rows.length} events · updated ${escapeHtml(stamp)} · <a href="${SOURCE_LINK}" target="_blank" rel="noopener noreferrer">Crypto Craft</a>`;
  }catch(error){
    console.error('Calendar load failed:', error);
    root.innerHTML = '<div class="empty error">Live calendar data could not be loaded right now. It will retry automatically, or open the source directly below.</div>';
    status.innerHTML = `Unable to load calendar · <a href="${SOURCE_LINK}" target="_blank" rel="noopener noreferrer">Open Crypto Craft</a>`;
  } finally {
    scheduleRefresh();
  }
}

loadCalendar();
</script>
</body>
</html>
