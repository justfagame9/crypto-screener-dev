<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151B;
    --panel2:#171B22;
    --border:#232833;
    --border-soft:#1B1F28;
    --text:#E6E9EF;
    --muted:#8B93A3;
    --faint:#565F70;
    --accent:#35E0C0;
    --accent-dim:#1E7F6F;
    --red:#FF5470;
    --red-dim:#7A2E3B;
    --amber:#F5A623;
    --blue:#5B8CFF;
    --violet:#A78BFA;
    --orange:#FF8A4C;
    --gold:#F0C24B;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-display);
    background:var(--bg);
    color:var(--text);
    padding:28px 20px 70px;
    background-image:
      radial-gradient(circle at 12% 0%, rgba(240,194,75,0.07), transparent 40%),
      radial-gradient(circle at 92% 15%, rgba(91,140,255,0.05), transparent 35%);
  }
  .wrap{max-width:820px;margin:0 auto;}

  /* ---- Top header ---- */
  .topheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
  .eyebrow{display:flex;align-items:center;gap:8px;font:700 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text);}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .header-right{display:flex;align-items:center;gap:10px;}
  .updated-label{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);white-space:nowrap;}
  .updated-label.label-error{color:var(--red);}
  .refresh-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;padding:0;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
  .refresh-btn svg{width:14px;height:14px;transition:transform .4s;}
  .refresh-btn.spinning svg{transform:rotate(360deg);}
  .sub{color:var(--muted);font-size:13px;line-height:1.55;margin:10px 0 16px;max-width:640px;}

  .degraded-banner{
    background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.25);color:#ffb3c1;
    border-radius:10px;padding:10px 14px;font:12px var(--font-mono);margin-bottom:16px;
    display:none;
  }
  .degraded-banner.show{display:block;}

  /* ---- Market pulse strip ---- */
  .pulse-strip{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:16px;
  }
  .pulse-item{display:flex;align-items:center;gap:7px;font:600 12.5px var(--font-mono);color:var(--muted);}
  .pulse-item b{color:var(--text);font-size:13.5px;}
  .pulse-up{color:var(--accent);}
  .pulse-down{color:var(--red);}
  .pulse-divider{width:1px;height:16px;background:var(--border);}

  /* ---- Watchlist rows ---- */
  .watch-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}

  .watch-item{position:relative;border-radius:14px;overflow:hidden;}

  .watch-delete-bg{
    position:absolute;inset:0;border-radius:14px;background:var(--red);
    display:flex;align-items:center;justify-content:flex-start;
  }
  .watch-delete-btn{
    height:100%;padding:0 20px;background:transparent;border:none;color:#fff;
    font:700 12px var(--font-mono);letter-spacing:.02em;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }

  .watch-card{
    position:relative;z-index:1;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;display:flex;flex-direction:column;
    transition:border-color .15s, transform .2s ease;
    touch-action:pan-y;user-select:none;
  }
  .watch-card:hover{border-color:var(--border-soft);}
  .watch-card.error{cursor:default;gap:8px;}
  .watch-item.open .watch-card{border-color:rgba(255,84,112,.4);}

  .watch-top{display:flex;align-items:center;gap:11px;}
  .watch-rank{
    flex-shrink:0;width:30px;height:22px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font:700 11px var(--font-mono);color:var(--faint);border:1px solid var(--border);
  }
  .watch-rank.top{color:var(--gold);border-color:rgba(240,194,75,.4);background:rgba(240,194,75,.08);}
  .coin-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .coin-icon-fallback{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font:700 13px var(--font-display);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .watch-id{min-width:0;flex:1;}
  .watch-symbol{font-size:15px;font-weight:700;line-height:1.25;}
  .watch-name{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .watch-price-block{text-align:right;flex-shrink:0;}
  .watch-price{
    font:700 16.5px var(--font-mono);letter-spacing:-.01em;
    border-radius:5px;padding:1px 4px;margin:-1px -4px;
  }
  .watch-price.flash-up{animation:flashUp .9s ease-out;}
  .watch-price.flash-down{animation:flashDown .9s ease-out;}
  @keyframes flashUp{0%{background:rgba(53,224,192,.35);}100%{background:transparent;}}
  @keyframes flashDown{0%{background:rgba(255,84,112,.35);}100%{background:transparent;}}
  .watch-change{font:600 12px var(--font-mono);margin-top:1px;}
  .watch-change.up{color:var(--accent);}
  .watch-change.down{color:var(--red);}

  .watch-chevron{
    flex-shrink:0;width:26px;height:26px;margin:-5px -6px -5px 2px;color:var(--faint);
    display:flex;align-items:center;justify-content:center;
    border-radius:7px;cursor:pointer;
    transition:transform .2s ease,color .15s,background .15s;
  }
  .watch-chevron:hover{color:var(--gold);background:var(--panel2);}
  .watch-chevron svg{width:12px;height:12px;}
  .watch-card.expanded .watch-chevron{transform:rotate(180deg);color:var(--muted);}

  .watch-details{
    max-height:0;opacity:0;overflow:hidden;
    display:flex;flex-direction:column;gap:10px;
    transition:max-height .22s ease,opacity .18s ease,margin-top .22s ease;
  }
  .watch-card.expanded .watch-details{max-height:160px;opacity:1;margin-top:12px;}

  .range-block{display:flex;flex-direction:column;gap:5px;}
  .range-title{font:10px var(--font-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;}
  .range-track{position:relative;height:5px;border-radius:4px;background:var(--border-soft);}
  .range-marker{
    position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    background:var(--gold);border:2px solid var(--bg);transform:translate(-50%,-50%);
    box-shadow:0 0 0 1px var(--gold);
  }
  .range-labels{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--muted);}

  .watch-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--border-soft);}
  .watch-asof{font:10.5px var(--font-mono);color:var(--faint);}
  .watch-link{font:600 11px var(--font-mono);color:var(--gold);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .watch-link:hover{text-decoration:underline;}
  .watch-foot-links{display:flex;align-items:center;gap:14px;}
  .analysis-btn{
    font:600 11px var(--font-mono);color:var(--blue);background:none;border:none;padding:0;
    text-decoration:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  }
  .analysis-btn:hover{text-decoration:underline;}

  /* ---- Analysis overlay (embeds screener.html's own analysis modal, over this page) ---- */
  .analysis-overlay{
    position:fixed;inset:0;background:rgba(5,6,9,.82);z-index:999;
    display:none;align-items:stretch;justify-content:center;
  }
  .analysis-overlay.open{display:flex;}
  .analysis-overlay-inner{position:relative;width:100%;height:100%;background:var(--bg);}
  .analysis-overlay-close{
    position:absolute;top:12px;right:12px;z-index:2;
    width:34px;height:34px;border-radius:9px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font:700 16px var(--font-mono);line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .analysis-overlay-close:hover{border-color:var(--red);color:var(--red);}
  .analysis-overlay-frame{width:100%;height:100%;border:0;display:block;}
  .watch-error-msg{color:var(--faint);font:12px var(--font-mono);}

  /* ---- Disclaimer / about panel ---- */
  .notice{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin:22px 0 22px;font-size:12px;line-height:1.6;color:var(--muted);
  }
  .notice b{color:var(--text);}
  .notice-summary{display:flex;align-items:center;gap:8px;}
  .notice-toggle{
    flex-shrink:0;width:20px;height:20px;padding:0;border-radius:6px;
    background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    font:700 13px var(--font-mono);line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, color .15s, border-color .15s;
  }
  .notice-toggle:hover{border-color:var(--gold);color:var(--gold);}
  .notice-toggle.open{transform:rotate(45deg);}
  .notice-details{margin-top:10px;}
  .notice-details[hidden]{display:none;}
  .notice .src-tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .src-tag{
    display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--font-mono);
    padding:4px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);
  }
  .src-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  .page-skeleton{display:flex;flex-direction:column;gap:10px;}
  .skel-card{height:150px;border-radius:14px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 37%,var(--panel) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  .error-state{
    padding:34px 20px;text-align:center;color:#ffb3c1;font:12.5px var(--font-mono);
    border:1px dashed rgba(255,84,112,.3);border-radius:12px;line-height:1.7;
  }
  .retry-btn{
    margin-top:12px;background:transparent;border:1px solid var(--border);color:var(--text);
    padding:8px 16px;border-radius:8px;font:600 12px var(--font-mono);cursor:pointer;
  }
  .retry-btn:hover{border-color:var(--gold);color:var(--gold);}

</style>
</head>
<body>

<div class="analysis-overlay" id="analysisOverlay">
  <div class="analysis-overlay-inner">
    <button class="analysis-overlay-close" id="analysisOverlayClose" type="button" aria-label="Close analysis">×</button>
    <iframe class="analysis-overlay-frame" id="analysisOverlayFrame" title="Coin analysis" src="about:blank"></iframe>
  </div>
</div>

<div class="wrap">

  <div class="topheader">
    <div class="eyebrow"><span class="dot"></span>Watchlist</div>
    <div class="header-right">
      <span class="updated-label" id="updatedLabel"></span>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </div>

  <div class="degraded-banner" id="degradedBanner"></div>

  <div id="pulseStrip"></div>

  <div id="content"></div>

  <div class="notice">
    <div class="notice-summary">
      <b>Reference data only, not a trading venue.</b>
      <button class="notice-toggle" id="noticeToggle" type="button" aria-expanded="false" aria-controls="noticeDetails" aria-label="Show more details">+</button>
    </div>
    <div class="notice-details" id="noticeDetails" hidden>
      Prices are the last trade on Binance's USDT-margined perpetual futures market and can differ slightly from spot price. This page doesn't place trades or hold positions. Not financial advice.
      <div class="src-tags">
        <span class="src-tag"><span class="dot"></span>Price · Binance USDT-M Futures</span>
        <span class="src-tag"><span class="dot"></span>Rank · CoinGecko</span>
      </div>
    </div>
  </div>

</div>

<script>
// ---------------- Config ----------------
// Add more coins here later - symbol is the clean display ticker (no USDT
// suffix), binanceSymbol is the exact USDT-M perpetual contract on Binance
// Futures, coingeckoId is CoinGecko's internal id (used only for market-cap
// rank + logo, never for price). Every coin (including the pinned defaults
// below) can be removed via the swipe-to-delete gesture on its card.
const DEFAULT_COINS = [
  { symbol: 'BTC', binanceSymbol: 'BTCUSDT', coingeckoId: 'bitcoin',  name: 'Bitcoin',  gradient: 'linear-gradient(135deg,#f7931a,#c9761a)', pinned: true },
  { symbol: 'ETH', binanceSymbol: 'ETHUSDT', coingeckoId: 'ethereum', name: 'Ethereum', gradient: 'linear-gradient(135deg,#8ea9ff,#5b6fd6)', pinned: true },
];

// Coins added via screener.html's "+ WL" button live here, shared through
// localStorage - screener.html writes to this key, this page reads it and
// appends those coins after DEFAULT_COINS (so a newly-added coin always ends
// up last), and resolves each one's CoinGecko id/name/logo the first time it
// loads (screener.html only knows the Binance symbol, not the CoinGecko id).
const CUSTOM_COINS_KEY = 'crypto-watchlist-custom-coins';
function loadCustomCoins(){
  try{
    const raw = localStorage.getItem(CUSTOM_COINS_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list.filter(c => c && c.binanceSymbol) : [];
  }catch(err){ return []; }
}
function saveCustomCoins(list){
  try{ localStorage.setItem(CUSTOM_COINS_KEY, JSON.stringify(list)); }catch(err){ /* not critical */ }
}

// Tracks which of the built-in DEFAULT_COINS the user has removed via the "-"
// button. DEFAULT_COINS itself is hardcoded in this file, so "removing" one
// can't delete it from an array literal - instead we keep a small denylist of
// binanceSymbols to filter out whenever the visible COINS list is rebuilt.
const REMOVED_DEFAULTS_KEY = 'crypto-watchlist-removed-defaults';
function loadRemovedDefaults(){
  try{
    const raw = localStorage.getItem(REMOVED_DEFAULTS_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(err){ return []; }
}
function saveRemovedDefaults(list){
  try{ localStorage.setItem(REMOVED_DEFAULTS_KEY, JSON.stringify(list)); }catch(err){ /* not critical */ }
}

let COINS = [];
function rebuildCoinsList(){
  const removedDefaults = new Set(loadRemovedDefaults());
  const activeDefaults = DEFAULT_COINS.filter(c => !removedDefaults.has(c.binanceSymbol));
  const defaultSymbols = new Set(DEFAULT_COINS.map(c => c.binanceSymbol));
  const custom = loadCustomCoins().filter(c => !defaultSymbols.has(c.binanceSymbol));
  COINS = activeDefaults.concat(custom);
}
rebuildCoinsList();

// Removes a coin from the watchlist immediately (both storage and the visible
// list) regardless of whether it's one of the built-in defaults (including
// pinned BTC/ETH) or one added via screener.html's "+ WL" button, then
// re-renders right away so the row's space is reclaimed by the rest of the
// list rather than left blank.
function removeCoin(binanceSymbol){
  const coin = DEFAULT_COINS.find(c => c.binanceSymbol === binanceSymbol);

  const isDefault = !!coin;
  if(isDefault){
    const removed = loadRemovedDefaults();
    if(!removed.includes(binanceSymbol)) removed.push(binanceSymbol);
    saveRemovedDefaults(removed);
  }else{
    saveCustomCoins(loadCustomCoins().filter(c => c.binanceSymbol !== binanceSymbol));
  }
  expandedCoins.delete(binanceSymbol);
  openSwipeItem = null;
  rebuildCoinsList();
  renderAll();
}

// Resolves CoinGecko id/name/logo for any custom coin that doesn't have one
// yet (screener.html only writes the Binance symbol when adding), then
// persists the resolution back to localStorage so it's a one-time lookup.
async function resolveCustomCoinMetadata(){
  const custom = loadCustomCoins();
  const unresolved = custom.filter(c => !c.coingeckoId);
  if(!unresolved.length) return false;
  let changed = false;
  for(const c of unresolved){
    try{
      const data = await fetchJSON(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(c.symbol)}`);
      const results = Array.isArray(data && data.coins) ? data.coins : [];
      const match = results.find(x => (x.symbol || '').toLowerCase() === c.symbol.toLowerCase()) || results[0];
      if(match){
        c.coingeckoId = match.id;
        if(match.name) c.name = match.name;
        changed = true;
      }
    }catch(err){
      console.warn(`[watchlist] couldn't resolve CoinGecko id for ${c.symbol}:`, err && err.message);
    }
  }
  if(changed){
    saveCustomCoins(custom);
    rebuildCoinsList();
  }
  return changed;
}

const PRICE_REFRESH_MS  = 30 * 1000;       // ticker price + 24h stats - fast
const RANK_REFRESH_MS   = 15 * 60 * 1000;  // market-cap rank - changes slowly
const PROXY_TIMEOUT_MS  = 8000;
const CACHE_KEY = 'crypto-watchlist-cache-v1';

// Same TradingView app-linking setup as screener.html's analysis modal, so
// "View chart" here behaves identically to opening a symbol there.
const TRADINGVIEW_APP_PACKAGE = 'com.tradingview.tradingviewapp';
function tradingViewChartUrl(binanceSymbol){
  const tvSymbol = `BINANCE:${binanceSymbol}.P`;
  return `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(tvSymbol)}`;
}
// window.open()/target="_blank" gets handed off to the phone's default
// browser by the WebView, which is why this used to open Chrome instead of
// the TradingView app. An Android "intent://" URL explicitly names the
// target app's package, so Android launches that app directly if it's
// installed, and only falls back to the browser (via S.browser_fallback_url)
// if it isn't. Non-Android contexts (desktop testing, iOS) just get a
// normal new-tab open since intent:// is an Android-only scheme.
//
// IMPORTANT: this must go through window.open(), not window.location.href -
// this page runs inside an iframe within index.html's shell, and only
// window.open() actually escapes the iframe out to the OS intent resolver.
function openExternalLink(webUrl, androidPackage){
  const isAndroid = /Android/i.test(navigator.userAgent || '');
  if(isAndroid && androidPackage){
    const hostAndPath = webUrl.replace(/^https?:\/\//, '');
    const intentUrl = `intent://${hostAndPath}#Intent;scheme=https;package=${androidPackage};S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
    window.open(intentUrl, '_blank', 'noopener,noreferrer');
    return;
  }
  window.open(webUrl, '_blank', 'noopener,noreferrer');
}
function openTradingViewChart(binanceSymbol){
  openExternalLink(tradingViewChartUrl(binanceSymbol), TRADINGVIEW_APP_PACKAGE);
}

// Same personal Cloudflare Worker used by the other pages in this app, as a
// CORS passthrough of last resort. Binance's futures API and CoinGecko's
// free markets endpoint are both normally directly fetchable (CORS-open), so
// this fallback should rarely be needed - but if it ever is, make sure
// fapi.binance.com and api.coingecko.com are allow-listed on the Worker.
const WORKER_PROXY_URL = 'https://newsyt.justfagame9.workers.dev';
function buildWorkerProxyUrl(u){
  return `${WORKER_PROXY_URL}/?url=${encodeURIComponent(u)}`;
}
const CORS_PROXIES = [
  (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  (u) => `https://proxy.corsfix.com/?${u}`,
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
];

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, { cache: 'no-store', signal: controller.signal });
  }finally{
    clearTimeout(timer);
  }
}
async function fetchJSONDirect(url){
  const res = await fetchWithTimeout(url, PROXY_TIMEOUT_MS);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function fetchJSONViaProxyChain(url){
  if(WORKER_PROXY_URL){
    try{
      const res = await fetchWithTimeout(buildWorkerProxyUrl(url), PROXY_TIMEOUT_MS);
      if(!res.ok) throw new Error('worker HTTP ' + res.status);
      return await res.json();
    }catch(err){
      console.warn('[proxy] worker failed:', err && err.message);
    }
  }
  return await Promise.any(CORS_PROXIES.map(buildProxyUrl => (async () => {
    const res = await fetchWithTimeout(buildProxyUrl(url), PROXY_TIMEOUT_MS);
    if(!res.ok) throw new Error('proxy HTTP ' + res.status);
    return await res.json();
  })()));
}
async function fetchJSON(url){
  try{
    return await fetchJSONDirect(url);
  }catch(err){
    return await fetchJSONViaProxyChain(url);
  }
}

// ---------------- Data fetch ----------------
// One request for ALL USDT-M perpetual symbols' 24h stats, filtered down to
// our watchlist client-side - far cheaper than one request per coin.
async function fetchAllTickers24hr(){
  const data = await fetchJSON('https://fapi.binance.com/fapi/v1/ticker/24hr');
  if(!Array.isArray(data)) throw new Error('Unexpected Binance ticker response shape');
  const wanted = new Set(COINS.map(c => c.binanceSymbol));
  const map = {};
  data.forEach(row => { if(wanted.has(row.symbol)) map[row.symbol] = row; });
  return map;
}
async function fetchRanks(){
  const ids = COINS.map(c => c.coingeckoId).filter(Boolean).join(',');
  if(!ids) return {};
  const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${encodeURIComponent(ids)}`;
  const data = await fetchJSON(url);
  if(!Array.isArray(data)) throw new Error('Unexpected CoinGecko response shape');
  const map = {};
  data.forEach(row => { map[row.id] = { rank: row.market_cap_rank, image: row.image }; });
  return map;
}

// ---------------- Rendering helpers ----------------
function escapeHtml(s){
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatPrice(v){
  if(!isFinite(v)) return '—';
  const decimals = v >= 100 ? 2 : v >= 1 ? 3 : 5;
  return '$' + v.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function formatVolume(v){
  if(!isFinite(v)) return '—';
  if(v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if(v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if(v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'K';
  return '$' + v.toFixed(0);
}
function rangeBar(low, high, current){
  if(!isFinite(low) || !isFinite(high) || !(high > low)) return '';
  const pct = Math.min(100, Math.max(0, ((current - low) / (high - low)) * 100));
  return `
    <div class="range-track"><div class="range-marker" style="left:${pct.toFixed(1)}%"></div></div>
    <div class="range-labels"><span>${formatPrice(low)}</span><span>${formatPrice(high)}</span></div>`;
}

// Tracks the last price we actually rendered for each coin, purely so we can
// flash green/red on the specific coins that moved this refresh instead of
// re-flashing every row on every tick.
const lastRenderedPrice = {};

// Tracks which coins are currently expanded (showing high/low, volume, and
// chart link) - a plain in-memory Set keyed by binanceSymbol. renderAll()
// rebuilds the whole list's innerHTML on every price refresh, so this state
// has to live outside that render call to survive across refreshes; it just
// resets to "all collapsed" on a full page reload, which is the desired
// default (matches the compact #rank-line-only view).
const expandedCoins = new Set();
// Which .watch-item currently has its swipe-to-delete panel open (if any) -
// used so opening a new one closes whichever was previously open.
let openSwipeItem = null;

function renderCoinRow(coin, ticker, rankInfo){
  const isExpanded = expandedCoins.has(coin.binanceSymbol);
  const deleteBg = `
    <div class="watch-delete-bg">
      <button class="watch-delete-btn" type="button" aria-label="Delete ${coin.symbol} from watchlist" onclick="removeCoin('${coin.binanceSymbol}')">Delete</button>
    </div>`;

  if(!ticker){
    return `
      <div class="watch-item" data-symbol="${coin.binanceSymbol}">
        ${deleteBg}
        <div class="watch-card error" data-symbol="${coin.binanceSymbol}">
          <div class="watch-top">
            <span class="watch-rank">—</span>
            <span class="coin-icon-fallback" style="background:${coin.gradient}">${coin.symbol[0]}</span>
            <div class="watch-id">
              <div class="watch-symbol">${coin.symbol}</div>
              <div class="watch-name">${escapeHtml(coin.name)}</div>
            </div>
          </div>
          <div class="watch-error-msg">Couldn't load ${coin.symbol} price this refresh.</div>
        </div>
      </div>`;
  }

  const price = parseFloat(ticker.lastPrice);
  const changePct = parseFloat(ticker.priceChangePercent);
  const isUp = changePct >= 0;
  const high = parseFloat(ticker.highPrice);
  const low = parseFloat(ticker.lowPrice);
  const quoteVolume = parseFloat(ticker.quoteVolume);
  const closeTime = ticker.closeTime ? new Date(ticker.closeTime) : null;

  const prev = lastRenderedPrice[coin.symbol];
  let flashClass = '';
  if(typeof prev === 'number' && isFinite(prev) && price !== prev){
    flashClass = price > prev ? 'flash-up' : 'flash-down';
  }
  lastRenderedPrice[coin.symbol] = price;

  const rank = rankInfo && rankInfo.rank;
  const isTopRank = typeof rank === 'number' && rank <= 10;
  const icon = (rankInfo && rankInfo.image)
    ? `<img class="coin-icon" src="${escapeHtml(rankInfo.image)}" alt="${coin.symbol}">`
    : `<span class="coin-icon-fallback" style="background:${coin.gradient}">${coin.symbol[0]}</span>`;

  return `
    <div class="watch-item" data-symbol="${coin.binanceSymbol}">
      ${deleteBg}
      <div class="watch-card ${isExpanded ? 'expanded' : ''}" data-symbol="${coin.binanceSymbol}">
        <div class="watch-top">
          <span class="watch-rank ${isTopRank ? 'top' : ''}">${typeof rank === 'number' ? '#' + rank : '—'}</span>
          ${icon}
          <div class="watch-id">
            <div class="watch-symbol">${coin.symbol}</div>
            <div class="watch-name">${escapeHtml(coin.name)}</div>
          </div>
          <div class="watch-price-block">
            <div class="watch-price ${flashClass}">${formatPrice(price)}</div>
            <div class="watch-change ${isUp ? 'up' : 'down'}">${isUp ? '▲' : '▼'} ${Math.abs(changePct).toFixed(2)}%</div>
          </div>
          <span class="watch-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </div>

        <div class="watch-details">
          <div class="range-block">
            <div class="range-title">24h range</div>
            ${rangeBar(low, high, price)}
          </div>

          <div class="watch-foot">
            <span class="watch-asof">${closeTime ? 'Vol ' + formatVolume(quoteVolume) : ''}</span>
            <span class="watch-foot-links">
              <button class="analysis-btn" type="button" onclick="event.preventDefault(); event.stopPropagation(); openAnalysisOverlay('${coin.binanceSymbol}')">Analysis</button>
              <a class="watch-link" href="${tradingViewChartUrl(coin.binanceSymbol)}" rel="noopener" onclick="event.preventDefault(); event.stopPropagation(); openTradingViewChart('${coin.binanceSymbol}')">View chart ↗</a>
            </span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderPulseStrip(tickers){
  const rows = COINS.map(c => tickers[c.binanceSymbol]).filter(Boolean);
  const el = document.getElementById('pulseStrip');
  if(!rows.length){ el.innerHTML = ''; return; }
  const upCount = rows.filter(r => parseFloat(r.priceChangePercent) >= 0).length;
  const downCount = rows.length - upCount;
  let biggest = rows[0];
  rows.forEach(r => { if(Math.abs(parseFloat(r.priceChangePercent)) > Math.abs(parseFloat(biggest.priceChangePercent))) biggest = r; });
  const biggestCoin = COINS.find(c => c.binanceSymbol === biggest.symbol);
  const biggestPct = parseFloat(biggest.priceChangePercent);

  el.innerHTML = `
    <div class="pulse-strip">
      <span class="pulse-item"><b class="pulse-up">${upCount}</b>&nbsp;up</span>
      <span class="pulse-divider"></span>
      <span class="pulse-item"><b class="pulse-down">${downCount}</b>&nbsp;down</span>
      <span class="pulse-divider"></span>
      <span class="pulse-item">Biggest mover&nbsp;<b class="${biggestPct >= 0 ? 'pulse-up' : 'pulse-down'}">${biggestCoin ? biggestCoin.symbol : ''} ${biggestPct >= 0 ? '+' : ''}${biggestPct.toFixed(2)}%</b></span>
    </div>`;
}

function renderAll(){
  const el = document.getElementById('content');
  const sorted = [...COINS].sort((a, b) => {
    const ra = (state.ranks[a.coingeckoId] && state.ranks[a.coingeckoId].rank) || 999;
    const rb = (state.ranks[b.coingeckoId] && state.ranks[b.coingeckoId].rank) || 999;
    return ra - rb;
  });
  el.innerHTML = `<div class="watch-list">${
    sorted.map(coin => renderCoinRow(
      coin,
      state.tickers[coin.binanceSymbol],
      state.ranks[coin.coingeckoId]
    )).join('')
  }</div>`;
  renderPulseStrip(state.tickers);
}

function renderSkeleton(){
  document.getElementById('content').innerHTML = `<div class="page-skeleton">${'<div class="skel-card"></div>'.repeat(COINS.length)}</div>`;
}

// ---------------- Card gestures: tap to expand/collapse, swipe left->right to reveal delete ----------------
// Delegated on the #content container (rather than bound per-card) so it
// keeps working across every renderAll() re-render without needing to be
// re-attached each time.
(function setupCardGestures(){
  const content = document.getElementById('content');
  const DRAG_THRESHOLD = 6;    // px of horizontal movement before it counts as a drag, not a tap
  const OPEN_RATIO = 0.4;      // fraction of the delete panel's width needed to snap open on release

  let dragItem = null;      // .watch-item currently being interacted with
  let dragCard = null;      // its .watch-card
  let startX = 0, startY = 0;
  let currentX = 0;
  let isDragging = false;   // confirmed horizontal drag (vs. tap or vertical scroll)
  let axisLocked = null;    // 'x' | 'y' | null, decided once movement exceeds threshold
  let maxReveal = 0;
  let pointerId = null;
  let dragOnChevron = false; // whether the pointerdown started on the expand/collapse chevron

  function closeItem(item){
    if(!item) return;
    const card = item.querySelector('.watch-card');
    if(card) card.style.transform = '';
    item.classList.remove('open');
    if(openSwipeItem === item) openSwipeItem = null;
  }

  content.addEventListener('pointerdown', (e) => {
    // Let real interactive elements (delete button, chart link) handle their own clicks.
    if(e.target.closest('a, button')) return;

    const card = e.target.closest('.watch-card');
    if(!card) return;
    const item = card.closest('.watch-item');
    if(!item) return;

    // Opening a new card's swipe panel closes whichever one was already open.
    if(openSwipeItem && openSwipeItem !== item) closeItem(openSwipeItem);

    dragItem = item;
    dragCard = card;
    startX = e.clientX;
    startY = e.clientY;
    currentX = item.classList.contains('open') ? maxRevealFor(item) : 0;
    isDragging = false;
    axisLocked = null;
    maxReveal = maxRevealFor(item);
    pointerId = e.pointerId;
    dragOnChevron = !!e.target.closest('.watch-chevron');
    dragCard.style.transition = 'none';
  });

  function maxRevealFor(item){
    const bg = item.querySelector('.watch-delete-bg');
    const btn = bg && bg.querySelector('.watch-delete-btn');
    return btn ? btn.offsetWidth : 84;
  }

  content.addEventListener('pointermove', (e) => {
    if(!dragCard || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if(axisLocked === null){
      if(Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
      axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if(axisLocked === 'x'){
        isDragging = true;
        try{ dragCard.setPointerCapture(pointerId); }catch(err){}
      }
    }
    if(axisLocked !== 'x') return;

    e.preventDefault();
    const base = dragItem.classList.contains('open') ? maxReveal : 0;
    let next = base + dx;
    next = Math.max(0, Math.min(maxReveal, next));
    dragCard.style.transform = `translateX(${next}px)`;
  }, { passive: false });

  function endDrag(e){
    if(!dragCard) return;
    dragCard.style.transition = '';

    if(isDragging && axisLocked === 'x'){
      const base = dragItem.classList.contains('open') ? maxReveal : 0;
      const dx = (e.clientX !== undefined ? e.clientX : startX) - startX;
      const finalX = Math.max(0, Math.min(maxReveal, base + dx));
      if(finalX > maxReveal * OPEN_RATIO){
        dragCard.style.transform = `translateX(${maxReveal}px)`;
        dragItem.classList.add('open');
        openSwipeItem = dragItem;
      }else{
        closeItem(dragItem);
      }
    }else{
      // A tap (no meaningful drag): if this item's delete panel is open, a tap
      // anywhere on the card closes it again. Otherwise, only a tap on the
      // chevron toggles expand/collapse - tapping elsewhere on the card does
      // nothing, so the row's own price/details aren't dismissed by accident.
      if(dragItem.classList.contains('open')){
        closeItem(dragItem);
      }else if(dragOnChevron){
        const symbol = dragCard.dataset.symbol;
        if(symbol && !dragCard.classList.contains('error')){
          const nowExpanded = !dragCard.classList.contains('expanded');
          dragCard.classList.toggle('expanded', nowExpanded);
          if(nowExpanded) expandedCoins.add(symbol); else expandedCoins.delete(symbol);
        }
      }
    }

    dragItem = null; dragCard = null; pointerId = null; axisLocked = null; isDragging = false; dragOnChevron = false;
  }

  content.addEventListener('pointerup', endDrag);
  content.addEventListener('pointercancel', endDrag);

  // Tapping anywhere outside the watchlist closes any open swipe panel.
  document.addEventListener('pointerdown', (e) => {
    if(openSwipeItem && !openSwipeItem.contains(e.target)) closeItem(openSwipeItem);
  });
})();

function updateLastUpdatedLabel(failed){
  const el = document.getElementById('updatedLabel');
  el.classList.toggle('label-error', !!failed);
  if(!lastUpdated){ el.textContent = failed ? 'Refresh failed - see console' : ''; return; }
  const secs = Math.max(0, Math.round((Date.now() - lastUpdated.getTime()) / 1000));
  const ago = secs < 60 ? `${secs}s ago` : secs < 3600 ? `${Math.round(secs/60)}m ago` : `${Math.round(secs/3600)}h ago`;
  el.textContent = (failed ? 'Refresh failed, showing cached · ' : 'Updated ') + ago;
}
function showDegradedBanner(text){
  const el = document.getElementById('degradedBanner');
  if(!text){ el.classList.remove('show'); el.textContent = ''; return; }
  el.textContent = text;
  el.classList.add('show');
}

// ---------------- Analysis overlay ----------------
// Embeds screener.html's own analysis modal (via its ?symbol= deep link)
// as a full-window overlay, so "Analysis" opens straight into it without
// leaving this page or losing watchlist state underneath.
function openAnalysisOverlay(binanceSymbol){
  if(!binanceSymbol) return;
  const frame = document.getElementById('analysisOverlayFrame');
  frame.src = `screener.html?symbol=${encodeURIComponent(binanceSymbol)}`;
  document.getElementById('analysisOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeAnalysisOverlay(){
  document.getElementById('analysisOverlay').classList.remove('open');
  document.getElementById('analysisOverlayFrame').src = 'about:blank';
  document.body.style.overflow = '';
}
document.getElementById('analysisOverlayClose').addEventListener('click', closeAnalysisOverlay);
document.getElementById('analysisOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'analysisOverlay') closeAnalysisOverlay();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.getElementById('analysisOverlay').classList.contains('open')) closeAnalysisOverlay();
});

// ---------------- State + cache (stale-while-revalidate, same pattern as the other pages) ----------------
const state = { tickers: {}, ranks: {} };
let lastUpdated = null;

function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ lastUpdated: lastUpdated ? lastUpdated.toISOString() : null, state }));
  }catch(err){ /* storage unavailable - not critical */ }
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const cached = JSON.parse(raw);
    if(!cached.state) return false;
    Object.assign(state, cached.state);
    lastUpdated = cached.lastUpdated ? new Date(cached.lastUpdated) : null;
    return true;
  }catch(err){ return false; }
}

// ---------------- Load cycles ----------------
async function loadPrices(){
  try{
    state.tickers = await fetchAllTickers24hr();
    lastUpdated = new Date();
    saveCache();
    renderAll();
    updateLastUpdatedLabel(false);
    return true;
  }catch(err){
    console.warn('[prices] failed:', err && err.message);
    updateLastUpdatedLabel(true);
    return false;
  }
}
async function loadRanks(){
  try{
    state.ranks = await fetchRanks();
    saveCache();
    renderAll();
    showDegradedBanner(null);
  }catch(err){
    console.warn('[ranks] failed:', err && err.message);
    if(!Object.keys(state.ranks).length){
      showDegradedBanner('Couldn\u2019t load CoinGecko rank data this refresh - showing prices without rank.');
    }
  }
}

async function refreshAll(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');

  if(Object.keys(state.tickers).length){
    renderAll();
    updateLastUpdatedLabel();
  }else{
    renderSkeleton();
  }

  const priceOk = await loadPrices();

  if(!priceOk && !Object.keys(state.tickers).length){
    document.getElementById('content').innerHTML = `
      <div class="error-state">
        Couldn't load prices right now (Binance futures API unreachable).<br>
        If you have a Cloudflare Worker configured for this app, make sure
        fapi.binance.com is allowed through it. Check the console for details.
        <br><button class="retry-btn" id="retryBtn" type="button">Try again</button>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', refreshAll);
  }

  // Was previously gated on "if state.ranks is completely empty" - which meant
  // once ANY rank data was cached (e.g. from the default coins), this would
  // never re-run even after a new custom coin (added via screener.html's
  // "+ WL") resolved its CoinGecko id. That coin would then permanently show
  // no rank/logo, since fetchRanks() simply never got called for it. Now it
  // re-checks whenever any coin currently in COINS is missing a rank entry.
  const missingRank = COINS.some(c => c.coingeckoId && !state.ranks[c.coingeckoId]);
  if(missingRank) await loadRanks();

  setTimeout(() => btn.classList.remove('spinning'), 400);
}

document.getElementById('refreshBtn').addEventListener('click', refreshAll);

document.getElementById('noticeToggle').addEventListener('click', () => {
  const btn = document.getElementById('noticeToggle');
  const details = document.getElementById('noticeDetails');
  const willOpen = details.hidden;
  details.hidden = !willOpen;
  btn.classList.toggle('open', willOpen);
  btn.setAttribute('aria-expanded', String(willOpen));
});

loadCache();
if(Object.keys(state.tickers).length) renderAll();
resolveCustomCoinMetadata().finally(refreshAll);
setInterval(loadPrices, PRICE_REFRESH_MS);
setInterval(loadRanks, RANK_REFRESH_MS);
setInterval(() => updateLastUpdatedLabel(false), 15000);

// Picks up a coin added from screener.html's "+ WL" button in another tab
// without needing a manual reload here - both pages share the same
// CUSTOM_COINS_KEY in localStorage, and the 'storage' event fires in every
// OTHER tab of the same origin whenever one tab writes to it.
window.addEventListener('storage', (e) => {
  if(e.key !== CUSTOM_COINS_KEY) return;
  rebuildCoinsList();
  resolveCustomCoinMetadata().finally(refreshAll);
});
</script>
</body>
