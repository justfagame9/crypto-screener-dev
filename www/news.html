<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0C10;--panel:#12151B;--panel2:#171B22;--border:#232833;--border-soft:#1B1F28;--text:#E6E9EF;--muted:#8B93A3;--faint:#565F70;--accent:#35E0C0;--red:#FF5470;--font-display:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace;}
  *{box-sizing:border-box;} html,body{margin:0;min-height:100%;} body{padding:30px 24px 60px;background:var(--bg);background-image:radial-gradient(circle at 12% 0%,rgba(53,224,192,.06),transparent 40%),radial-gradient(circle at 92% 15%,rgba(255,84,112,.05),transparent 35%);color:var(--text);font-family:var(--font-display);}
  .wrap{max-width:1180px;margin:0 auto;}.eyebrow{font:11px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;} h1{font-size:26px;margin:0 0 6px;font-weight:700;} .sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:24px;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}.status{color:var(--muted);font:11.5px var(--font-mono);} button{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font:600 12px var(--font-mono);padding:8px 12px;} button:hover{border-color:var(--accent);color:var(--accent);} button:disabled{cursor:wait;opacity:.55;}
  .news-list{display:grid;gap:10px;}.article{display:grid;grid-template-columns:58px 1fr auto;gap:16px;align-items:start;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;transition:border-color .15s,transform .15s;}.article:hover{border-color:var(--accent);transform:translateY(-1px);}.rank{color:var(--accent);font:600 14px var(--font-mono);}.source{color:var(--faint);font:10px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}.title{color:var(--text);font-size:15px;font-weight:600;line-height:1.35;text-decoration:none;}.title:hover{color:var(--accent);}.date{color:var(--faint);font:10.5px var(--font-mono);white-space:nowrap;}.empty{padding:28px;color:var(--faint);font:12px var(--font-mono);text-align:center;border:1px dashed var(--border);border-radius:10px;}.error{color:#ffb3c1;border-color:rgba(255,84,112,.35);}
  @media(max-width:600px){body{padding:22px 14px 40px;} .article{grid-template-columns:34px 1fr;gap:10px 12px;} .date{grid-column:2;}.title{font-size:14px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">MARKET BRIEF · CRYPTO NEWS</div>
  <h1>Top Crypto News</h1>
  <div class="toolbar"><span class="status" id="status">Loading latest articles...</span></div>
  <main class="news-list" id="newsList"><div class="empty">Fetching the latest articles...</div></main>
</div>
<script>
const NEWS_SOURCES = [
  {name:'CoinDesk', feed:'https://www.coindesk.com/arc/outboundfeeds/rss/'},
  {name:'Cointelegraph', feed:'https://cointelegraph.com/rss'},
  {name:'Decrypt', feed:'https://decrypt.co/feed'},
  {name:'Bitcoin.com', feed:'https://news.bitcoin.com/feed/'},
  {name:'Blockworks', feed:'https://blockworks.co/feed'},
  {name:'The Block', feed:'https://www.theblock.co/rss.xml'}
];
const list = document.getElementById('newsList');
const status = document.getElementById('status');
let refreshTimer;

function formatDate(value){
  return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
}
function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
}
function normalizeTitle(value){
  return String(value).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function areSimilar(first, second){
  const firstWords = new Set(normalizeTitle(first).split(' ').filter(word => word.length > 2));
  const secondWords = new Set(normalizeTitle(second).split(' ').filter(word => word.length > 2));
  if(!firstWords.size || !secondWords.size) return false;
  let overlap = 0;
  firstWords.forEach(word => { if(secondWords.has(word)) overlap += 1; });
  return overlap / Math.min(firstWords.size, secondWords.size) >= 0.65;
}
function removeSimilarArticles(articles){
  return articles
    .sort((first, second) => new Date(second.pubDate) - new Date(first.pubDate))
    .filter((article, index, allArticles) => !allArticles.slice(0,index).some(previous => areSimilar(article.title, previous.title)));
}
function renderArticles(articles){
  list.innerHTML = articles.slice(0,15).map((article,index) => `
    <article class="article">
      <div class="rank">${String(index + 1).padStart(2,'0')}</div>
      <div><div class="source">${escapeHtml(article.source)}</div><a class="title" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.title)}</a></div>
      <time class="date" datetime="${escapeHtml(article.pubDate)}">${formatDate(article.pubDate)}</time>
    </article>`).join('');
}
async function loadNews(){
  status.textContent = 'Refreshing latest articles...';
  try{
    const results = await Promise.allSettled(NEWS_SOURCES.map(async source => {
      const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.feed)}`;
      const response = await fetch(url, {cache:'no-store'});
      if(!response.ok) throw new Error(`News request failed (${response.status})`);
      const data = await response.json();
      return Array.isArray(data.items) ? data.items
        .filter(article => article.title && article.link)
        .map(article => ({...article, source:source.name})) : [];
    }));
    const articles = removeSimilarArticles(results
      .filter(result => result.status === 'fulfilled')
      .flatMap(result => result.value));
    if(!articles.length) throw new Error('No articles returned');
    renderArticles(articles);
    status.textContent = `Updated ${new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date())} · ${articles.length} distinct stories`;
  }catch(error){
    list.innerHTML = '<div class="empty error">News could not be loaded. Try refreshing again.</div>';
    status.textContent = 'Unable to load news';
  }finally{
    scheduleRefresh();
  }
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  const now = new Date();
  const next = new Date(now);
  next.setMinutes(0,0,0);
  next.setHours(now.getHours() - (now.getHours() % 4) + 4);
  refreshTimer = setTimeout(loadNews, Math.max(1000, next - now));
}
loadNews();
</script>
</body>
</html>
