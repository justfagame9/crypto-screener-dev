<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trump's Truth Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151B;
    --panel2:#171B22;
    --border:#232833;
    --border-soft:#1B1F28;
    --text:#E6E9EF;
    --muted:#8B93A3;
    --faint:#565F70;
    --accent:#FF5470;
    --accent-light:#FFB3C1;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    padding:30px 24px 60px;
    background:var(--bg);
    background-image:radial-gradient(circle at 12% 0%,rgba(255,84,112,.06),transparent 40%),radial-gradient(circle at 92% 15%,rgba(255,84,112,.05),transparent 35%);
    color:var(--text);
    font-family:var(--font-display);
  }
  
  .wrap{max-width:1000px;margin:0 auto;}
  .eyebrow{font:11px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-size:26px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:24px;}
  
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .status{color:var(--muted);font:11.5px var(--font-mono);}
  button{
    background:transparent;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    cursor:pointer;
    font:600 12px var(--font-mono);
    padding:8px 12px;
  }
  button:hover{border-color:var(--accent);color:var(--accent);}
  button:disabled{cursor:wait;opacity:.55;}
  
  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .filter-chip{
    background:rgba(255,84,112,.15);
    border:1px solid rgba(255,84,112,.3);
    color:var(--accent-light);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
    transition:all .2s;
  }
  .filter-chip:hover{
    background:rgba(255,84,112,.25);
    border-color:var(--accent);
  }
  .filter-chip.active{
    background:var(--accent);
    color:#000;
    border-color:var(--accent);
  }
  
  .tweets-container{
    display:grid;
    gap:14px;
  }
  
  .tweet-card{
    padding:20px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    transition:all .2s;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .tweet-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,84,112,.12);
  }
  
  .tweet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .tweet-author{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
  }
  .tweet-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg, #FF5470, #FF8AA2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .author-info{
    display:flex;
    flex-direction:column;
  }
  .author-name{
    font-weight:600;
    font-size:14px;
    color:var(--text);
  }
  .author-handle{
    font-size:12px;
    color:var(--muted);
    font-family:var(--font-mono);
  }
  .tweet-time{
    color:var(--faint);
    font:11px var(--font-mono);
    white-space:nowrap;
  }
  
  .tweet-content{
    line-height:1.6;
    font-size:15px;
    color:var(--text);
    word-break:break-word;
  }
  
  .tweet-keywords{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .keyword-badge{
    background:rgba(255,84,112,.2);
    border:1px solid rgba(255,84,112,.4);
    color:var(--accent-light);
    padding:4px 10px;
    border-radius:16px;
    font-size:11px;
    font-weight:600;
    font-family:var(--font-mono);
  }
  
  .tweet-stats{
    display:flex;
    gap:20px;
    font-size:12px;
    color:var(--muted);
    border-top:1px solid var(--border-soft);
    padding-top:12px;
    margin-top:8px;
  }
  .stat-item{
    display:flex;
    align-items:center;
    gap:6px;
  }
  
  .empty{
    padding:40px 28px;
    color:var(--faint);
    font:13px var(--font-mono);
    text-align:center;
    border:1px dashed var(--border);
    border-radius:10px;
  }
  
  .error{
    padding:20px;
    background:rgba(255,84,112,.1);
    border:1px solid rgba(255,84,112,.3);
    border-radius:10px;
    color:var(--accent-light);
    font-size:13px;
    margin-bottom:20px;
  }
  
  .tweet-count{
    color:var(--muted);
    font-size:12px;
    font-family:var(--font-mono);
  }
  
  @media(max-width:600px){
    body{padding:20px 16px 40px;}
    .tweet-card{padding:16px;}
    .tweet-header{flex-direction:column;align-items:flex-start;}
    .tweet-time{order:3;width:100%;}
    .tweet-content{font-size:14px;}
  }
</style>
</head>

const container = document.getElementById('tweetsContainer');
const status = document.getElementById('status');
const tweetCount = document.getElementById('tweetCount');
const filterChips = document.querySelectorAll('.filter-chip');
let allPosts = [...MOCK_POSTS];
let activeFilters = new Set(['crypto', 'clarity']);

// Filter chip toggle
filterChips.forEach(chip => {
  chip.addEventListener('click', () => {
    const filter = chip.dataset.filter;
    if(activeFilters.has(filter)){
      activeFilters.delete(filter);
      chip.classList.remove('active');
    } else {
      activeFilters.add(filter);
      chip.classList.add('active');
    }
    renderPosts();
  });
});

function formatDate(date) {
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if(minutes < 60) return `${minutes}m ago`;
  if(hours < 24) return `${hours}h ago`;
  if(days < 7) return `${days}d ago`;
  
  return new Intl.DateTimeFormat(undefined, {month:'short', day:'numeric', year:'2-digit'}).format(date);
}

function getMatchingKeywords(content) {
  const lowerContent = content.toLowerCase();
  const matching = [];
  if(lowerContent.includes('crypto') || lowerContent.includes('cryptocurrency')) matching.push('crypto');
  if(lowerContent.includes('clarity act')) matching.push('clarity');
  if(lowerContent.includes('bitcoin')) matching.push('bitcoin');
  if(lowerContent.includes('hype')) matching.push('hype');
  if(lowerContent.includes('genius act')) matching.push('genius');
  if(lowerContent.includes('prediction market')) matching.push('prediction');
  return matching;
}

function renderPosts(){
  if(!allPosts || allPosts.length === 0){
    container.innerHTML = '<div class="empty">No posts found. Try adjusting filters.</div>';
    status.textContent = 'No posts';
    tweetCount.textContent = '';
    return;
  }
  
  const filtered = allPosts.filter(post => {
    const keywords = getMatchingKeywords(post.content);
    return keywords.some(k => activeFilters.has(k));
  });
  
  if(filtered.length === 0){
    container.innerHTML = '<div class="empty">No posts match the selected filters.</div>';
    status.textContent = 'No results';
    tweetCount.textContent = '';
    return;
  }
  
  const html = filtered.map(post => `
    <div class="tweet-card">
      <div class="tweet-header">
        <div class="tweet-author">
          <div class="tweet-avatar">🇺🇸</div>

      </div>
      <div class="tweet-content">${post.content}</div>
      <div class="tweet-keywords">
        ${post.keywords.map(kw => `<span class="keyword-badge">${kw.toUpperCase()}</span>`).join('')}
      </div>
      <div class="tweet-stats">
        <span class="stat-item">❤️ ${post.likes.toLocaleString()} likes</span>
        <span class="stat-item">🔄 ${post.reposts.toLocaleString()} reposts</span>
        <span class="stat-item">💬 ${post.replies.toLocaleString()} replies</span>
      </div>
    </div>
  `).join('');
  
  container.innerHTML = html;
  status.textContent = `Showing ${filtered.length} posts`;
  tweetCount.textContent = `${filtered.length} of ${allPosts.length} posts match your filters`;
}
